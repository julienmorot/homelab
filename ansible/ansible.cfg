[defaults]
host_key_checking = False
callbacks_enabled = timer, profile_tasks, profile_roles
forks = 20
nocows = 1
collections_path = .ansible/collections
roles_path = .ansible/roles


[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=600s
pipelining = True

[diff]
always = true
context = 3

